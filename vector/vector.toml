# Vector Configuration for Convergence Network Observability

# Data Directory
data_dir = "/var/lib/vector"

# Syslog Source
[sources.syslog]
type = "syslog"
mode = "udp"
address = "0.0.0.0:514"

# SNMP Trap Source (via UDP)
[sources.snmp_traps]
type = "socket"
mode = "udp"
address = "0.0.0.0:162"

# Internal Metrics
[sources.internal_metrics]
type = "internal_metrics"

# Parse and enrich syslog messages
[transforms.parse_syslog]
type = "remap"
inputs = ["syslog"]
source = '''
  # Extract additional fields from syslog
  .timestamp = now()
  .log_type = "syslog"

  # Parse severity
  if exists(.severity) {
    .severity_text = if .severity == 0 {
      "emergency"
    } else if .severity == 1 {
      "alert"
    } else if .severity == 2 {
      "critical"
    } else if .severity == 3 {
      "error"
    } else if .severity == 4 {
      "warning"
    } else if .severity == 5 {
      "notice"
    } else if .severity == 6 {
      "informational"
    } else {
      "debug"
    }
  }
'''

# Parse SNMP traps
[transforms.parse_snmp]
type = "remap"
inputs = ["snmp_traps"]
source = '''
  .timestamp = now()
  .log_type = "snmp_trap"
  # Additional SNMP parsing will be enhanced based on trap formats
'''

# Convert logs to metrics
[transforms.log_to_metrics]
type = "log_to_metric"
inputs = ["parse_syslog"]

[[transforms.log_to_metrics.metrics]]
type = "counter"
field = "message"
name = "network_log_total"
namespace = "convergence"
tags.severity = "{{severity_text}}"
tags.hostname = "{{hostname}}"

# Sink to VictoriaMetrics
[sinks.victoriametrics]
type = "prometheus_remote_write"
inputs = ["log_to_metrics", "internal_metrics"]
endpoint = "http://victoriametrics:8428/api/v1/write"
healthcheck.enabled = true

# Sink logs to stdout for debugging
[sinks.console_logs]
type = "console"
inputs = ["parse_syslog", "parse_snmp"]
encoding.codec = "json"

# Vector API for health checks
[api]
enabled = true
address = "0.0.0.0:8686"
