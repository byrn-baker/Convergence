# Convergence OpenTelemetry Collector Configuration
# Simplified version - tested format from official docs

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  pprof:
    endpoint: 0.0.0.0:1777

  zpages:
    endpoint: 0.0.0.0:55679

receivers:
  # OpenTelemetry Protocol receivers
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Prometheus receiver for self-monitoring
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 30s
          static_configs:
            - targets: ['localhost:8888']
              labels:
                service: 'otel-collector'

  # Syslog receivers for network devices (RFC 3164 BSD format)
  syslog/udp:
    udp:
      listen_address: "0.0.0.0:514"
    protocol: rfc3164
    location: America/Denver
    attributes:
      protocol: udp
    operators:
      # Parse pfSense filterlog format (only for filterlog entries)
      - type: regex_parser
        if: 'attributes.appname == "filterlog"'
        regex: '^(?P<rule_num>\d+),[^,]*,[^,]*,(?P<tracker>\d+),(?P<interface>[^,]+),(?P<reason>[^,]+),(?P<action>pass|block),(?P<direction>in|out),(?P<ip_version>\d),[^,]*,[^,]*,[^,]*,[^,]*,[^,]*,[^,]*,(?P<proto_id>\d+),(?P<proto_name>\w+),[^,]*,(?P<src_ip>[\d\.]+),(?P<dst_ip>[\d\.]+)'
        parse_from: attributes.message
        parse_to: attributes
        on_error: send
      - type: add
        if: 'attributes.appname == "filterlog"'
        field: attributes.log_type
        value: "firewall"

  syslog/tcp:
    tcp:
      listen_address: "0.0.0.0:514"
    protocol: rfc3164
    location: America/Denver
    attributes:
      protocol: tcp
    operators:
      # Parse pfSense filterlog format (only for filterlog entries)
      - type: regex_parser
        if: 'attributes.appname == "filterlog"'
        regex: '^(?P<rule_num>\d+),[^,]*,[^,]*,(?P<tracker>\d+),(?P<interface>[^,]+),(?P<reason>[^,]+),(?P<action>pass|block),(?P<direction>in|out),(?P<ip_version>\d),[^,]*,[^,]*,[^,]*,[^,]*,[^,]*,[^,]*,(?P<proto_id>\d+),(?P<proto_name>\w+),[^,]*,(?P<src_ip>[\d\.]+),(?P<dst_ip>[\d\.]+)'
        parse_from: attributes.message
        parse_to: attributes
        on_error: send
      - type: add
        if: 'attributes.appname == "filterlog"'
        field: attributes.log_type
        value: "firewall"

  # SNMP receivers - Auto-generated from Nautobot
  # Device metadata (hostname, site, vendor, model, role) added via attributes processors

  # HomeSwitch01 - 192.168.3.2
  snmp/homeswitch01:
    collection_interval: 60s
    endpoint: "udp://192.168.3.2:161"
    version: v2c
    community: ${env:SNMP_COMMUNITY}
    attributes:
      interface.name:
        oid: "1.3.6.1.2.1.2.2.1.2"
        indexed_value_prefix: ""
      interface.description:
        oid: "1.3.6.1.2.1.31.1.1.1.18"
        indexed_value_prefix: ""
    metrics:
      system.uptime:
        unit: "s"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.2.1.1.3.0"
      interface.in.octets:
        unit: "By"
        sum:
          aggregation: cumulative
          monotonic: true
          value_type: int
        column_oids:
          - oid: "1.3.6.1.2.1.2.2.1.10"
            attributes:
              - name: interface.name
      interface.out.octets:
        unit: "By"
        sum:
          aggregation: cumulative
          monotonic: true
          value_type: int
        column_oids:
          - oid: "1.3.6.1.2.1.2.2.1.16"
            attributes:
              - name: interface.name
      interface.in.errors:
        unit: "1"
        sum:
          aggregation: cumulative
          monotonic: true
          value_type: int
        column_oids:
          - oid: "1.3.6.1.2.1.2.2.1.14"
            attributes:
              - name: interface.name

  # HomeSwitch02 - 192.168.3.3
  snmp/homeswitch02:
    collection_interval: 60s
    endpoint: "udp://192.168.3.3:161"
    version: v2c
    community: ${env:SNMP_COMMUNITY}
    attributes:
      interface.name:
        oid: "1.3.6.1.2.1.2.2.1.2"
        indexed_value_prefix: ""
      interface.description:
        oid: "1.3.6.1.2.1.31.1.1.1.18"
        indexed_value_prefix: ""
    metrics:
      system.uptime:
        unit: "s"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.2.1.1.3.0"
      interface.in.octets:
        unit: "By"
        sum:
          aggregation: cumulative
          monotonic: true
          value_type: int
        column_oids:
          - oid: "1.3.6.1.2.1.2.2.1.10"
            attributes:
              - name: interface.name
      interface.out.octets:
        unit: "By"
        sum:
          aggregation: cumulative
          monotonic: true
          value_type: int
        column_oids:
          - oid: "1.3.6.1.2.1.2.2.1.16"
            attributes:
              - name: interface.name
      interface.in.errors:
        unit: "1"
        sum:
          aggregation: cumulative
          monotonic: true
          value_type: int
        column_oids:
          - oid: "1.3.6.1.2.1.2.2.1.14"
            attributes:
              - name: interface.name

  # pfSense-FW01 - 192.168.100.1
  snmp/pfsense-fw01:
    collection_interval: 60s
    endpoint: "udp://192.168.100.1:161"
    version: v2c
    community: ${env:SNMP_COMMUNITY}
    attributes:
      interface.name:
        oid: "1.3.6.1.2.1.2.2.1.2"
        indexed_value_prefix: ""
      interface.description:
        oid: "1.3.6.1.2.1.31.1.1.1.18"
        indexed_value_prefix: ""
    metrics:
      system.uptime:
        unit: "s"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.2.1.1.3.0"
      interface.in.octets:
        unit: "By"
        sum:
          aggregation: cumulative
          monotonic: true
          value_type: int
        column_oids:
          - oid: "1.3.6.1.2.1.2.2.1.10"
            attributes:
              - name: interface.name
      interface.out.octets:
        unit: "By"
        sum:
          aggregation: cumulative
          monotonic: true
          value_type: int
        column_oids:
          - oid: "1.3.6.1.2.1.2.2.1.16"
            attributes:
              - name: interface.name
      interface.in.errors:
        unit: "1"
        sum:
          aggregation: cumulative
          monotonic: true
          value_type: int
        column_oids:
          - oid: "1.3.6.1.2.1.2.2.1.14"
            attributes:
              - name: interface.name

processors:
  # Memory limiter prevents OOM
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Batch processor for efficiency
  batch:
    send_batch_size: 1024
    timeout: 10s
    send_batch_max_size: 2048

  # Add platform and device labels to metrics
  resource:
    attributes:
      - key: platform
        value: "convergence"
        action: insert

  # Convert Delta to Cumulative for Prometheus compatibility
  deltatocumulative/firewall:
    max_stale: 5m

  # Add Nautobot device metadata to SNMP metrics
  # HomeSwitch01 metadata
  attributes/homeswitch01:
    actions:
      - key: device.name
        value: "HomeSwitch01"
        action: insert
      - key: device.ip
        value: "192.168.3.2"
        action: insert
      - key: device.vendor
        value: "Cisco"
        action: insert
      - key: device.model
        value: "WS-C3850-48P"
        action: insert
      - key: device.role
        value: "home_switch"
        action: insert
      - key: device.site
        value: "House"
        action: insert

  # HomeSwitch02 metadata
  attributes/homeswitch02:
    actions:
      - key: device.name
        value: "HomeSwitch02"
        action: insert
      - key: device.ip
        value: "192.168.3.3"
        action: insert
      - key: device.vendor
        value: "Cisco"
        action: insert
      - key: device.model
        value: "WS-C3850-48P"
        action: insert
      - key: device.role
        value: "home_switch"
        action: insert
      - key: device.site
        value: "House"
        action: insert

  # pfSense-FW01 metadata
  attributes/pfsense-fw01:
    actions:
      - key: device.name
        value: "pfSense-FW01"
        action: insert
      - key: device.ip
        value: "192.168.100.1"
        action: insert
      - key: device.vendor
        value: "Netgate"
        action: insert
      - key: device.model
        value: "8200 Max PFSense+ Security Gateway"
        action: insert
      - key: device.role
        value: "firewall"
        action: insert
      - key: device.site
        value: "House"
        action: insert

  # Enrich syslog logs with device metadata from Nautobot
  transform/syslog_enrichment:
    error_mode: ignore
    log_statements:
      - context: log
        conditions:
          - attributes["appname"] == "filterlog"
        statements:
          - set(attributes["device.name"], "pfSense-FW01")
          - set(attributes["device.vendor"], "Netgate")
          - set(attributes["device.role"], "firewall")
          - set(attributes["device.site"], "House")

exporters:
  # Prometheus Remote Write to VictoriaMetrics
  prometheusremotewrite:
    endpoint: "http://victoriametrics:8428/api/v1/write"
    tls:
      insecure: true

  # File exporter for syslog logs (Promtail will tail these)
  file/syslog:
    path: /data/syslog/syslog.jsonl
    rotation:
      max_megabytes: 100
      max_days: 3
      max_backups: 3
    format: json

  # Debug exporter for troubleshooting
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 200

connectors:
  # Convert pfSense firewall logs to metrics
  count/firewall:
    logs:
      firewall_events:
        description: "Count of firewall events"
        conditions:
          - 'attributes["log_type"] == "firewall"'
        attributes:
          - key: action
          - key: direction
          - key: interface
          - key: proto_name
          - key: src_ip
          - key: dst_ip

service:
  extensions: [health_check, pprof, zpages]

  pipelines:
    # Metrics pipeline - HomeSwitch01
    metrics/homeswitch01:
      receivers: [snmp/homeswitch01]
      processors: [memory_limiter, attributes/homeswitch01, resource, batch]
      exporters: [prometheusremotewrite, debug]

    # Metrics pipeline - HomeSwitch02
    metrics/homeswitch02:
      receivers: [snmp/homeswitch02]
      processors: [memory_limiter, attributes/homeswitch02, resource, batch]
      exporters: [prometheusremotewrite, debug]

    # Metrics pipeline - pfSense
    metrics/pfsense-fw01:
      receivers: [snmp/pfsense-fw01]
      processors: [memory_limiter, attributes/pfsense-fw01, resource, batch]
      exporters: [prometheusremotewrite, debug]

    # Metrics pipeline - General (OTLP and Prometheus)
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheusremotewrite, debug]

    # Logs pipeline - OTLP
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]

    # Syslog pipeline - Network devices (RFC 3164 BSD format from Cisco/pfSense)
    # Writes to file (for Loki via Promtail) and converts to metrics
    logs/syslog:
      receivers: [syslog/udp, syslog/tcp]
      processors: [memory_limiter, transform/syslog_enrichment, resource, batch]
      exporters: [file/syslog, count/firewall, debug]

    # Firewall metrics pipeline - Converts parsed firewall logs to metrics
    metrics/firewall:
      receivers: [count/firewall]
      processors: [memory_limiter, deltatocumulative/firewall, resource, batch]
      exporters: [prometheusremotewrite, debug]

    # Traces pipeline (minimal)
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]

  # Self-monitoring configuration
  telemetry:
    logs:
      level: info
      encoding: json
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
