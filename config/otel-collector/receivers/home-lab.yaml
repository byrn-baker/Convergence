      receivers: [otlp, prometheus, snmp/homeswitch01, snmp/homeswitch02, snmp/pfsense-fw01]
      processors: [memory_limiter, attributes/homeswitch01, attributes/homeswitch02, attributes/pfsense-fw01, resource, batch]
      exporters: [prometheusremotewrite, debug]