receivers:
snmp/homeswitch01:
  attributes:
    interface.description:
      indexed_value_prefix: ''
      oid: 1.3.6.1.2.1.31.1.1.1.18
    interface.name:
      indexed_value_prefix: ''
      oid: 1.3.6.1.2.1.2.2.1.2
  collection_interval: 60s
  community: ${env:SNMP_COMMUNITY}
  endpoint: udp://192.168.3.2:161
  metrics:
    interface.in.errors:
      column_oids:
      - attributes:
        - name: interface.name
        oid: 1.3.6.1.2.1.2.2.1.14
      sum:
        aggregation: cumulative
        monotonic: true
        value_type: int
      unit: '1'
    interface.in.octets:
      column_oids:
      - attributes:
        - name: interface.name
        oid: 1.3.6.1.2.1.2.2.1.10
      sum:
        aggregation: cumulative
        monotonic: true
        value_type: int
      unit: By
    interface.out.octets:
      column_oids:
      - attributes:
        - name: interface.name
        oid: 1.3.6.1.2.1.2.2.1.16
      sum:
        aggregation: cumulative
        monotonic: true
        value_type: int
      unit: By
    system.uptime:
      gauge:
        value_type: int
      scalar_oids:
      - oid: 1.3.6.1.2.1.1.3.0
      unit: s
  version: v2c
snmp/homeswitch02:
  attributes:
    interface.description:
      indexed_value_prefix: ''
      oid: 1.3.6.1.2.1.31.1.1.1.18
    interface.name:
      indexed_value_prefix: ''
      oid: 1.3.6.1.2.1.2.2.1.2
  collection_interval: 60s
  community: ${env:SNMP_COMMUNITY}
  endpoint: udp://192.168.3.3:161
  metrics:
    interface.in.errors:
      column_oids:
      - attributes:
        - name: interface.name
        oid: 1.3.6.1.2.1.2.2.1.14
      sum:
        aggregation: cumulative
        monotonic: true
        value_type: int
      unit: '1'
    interface.in.octets:
      column_oids:
      - attributes:
        - name: interface.name
        oid: 1.3.6.1.2.1.2.2.1.10
      sum:
        aggregation: cumulative
        monotonic: true
        value_type: int
      unit: By
    interface.out.octets:
      column_oids:
      - attributes:
        - name: interface.name
        oid: 1.3.6.1.2.1.2.2.1.16
      sum:
        aggregation: cumulative
        monotonic: true
        value_type: int
      unit: By
    system.uptime:
      gauge:
        value_type: int
      scalar_oids:
      - oid: 1.3.6.1.2.1.1.3.0
      unit: s
  version: v2c
snmp/pfsense-fw01:
  attributes:
    # IF-MIB interface attributes (indexed by ifIndex)
    interface.description:
      indexed_value_prefix: ''
      oid: 1.3.6.1.2.1.31.1.1.1.18   # ifAlias / friendly name
    interface.name:
      indexed_value_prefix: ''
      oid: 1.3.6.1.2.1.2.2.1.2       # ifDescr
    # NOTE: interface.mac (ifPhysAddress 1.3.6.1.2.1.2.2.1.6) intentionally
    # omitted — bsnmpd returns raw 6-byte binary (PhysAddress type) which causes
    # the OTEL SNMP receiver to silently drop entire metrics that reference it.
    # HOST-RESOURCES-MIB storage attributes (indexed by hrStorageIndex)
    # Requires hostres.so module in pfSense SNMP service (Services > SNMP > Modules)
    storage.description:
      indexed_value_prefix: ''
      oid: 1.3.6.1.2.1.25.2.3.1.3    # hrStorageDescr (e.g. "Real Memory", "/", "/var")
    # HOST-RESOURCES-MIB processor attributes (indexed by hrDeviceIndex)
    cpu.description:
      indexed_value_prefix: ''
      oid: 1.3.6.1.2.1.25.3.2.1.3    # hrDeviceDescr (e.g. "GenuineIntel: Intel(R) Atom...")
    # IP-MIB attributes (indexed by ipAdEntAddr = the IP address itself)
    ip.address:
      indexed_value_prefix: ''
      oid: 1.3.6.1.2.1.4.20.1.1      # ipAdEntAddr
    ip.netmask:
      indexed_value_prefix: ''
      oid: 1.3.6.1.2.1.4.20.1.3      # ipAdEntNetMask
  collection_interval: 60s
  community: ${env:SNMP_COMMUNITY}
  endpoint: udp://192.168.3.1:161
  metrics:
    # ------------------------------------------------------------------ #
    # Existing interface traffic counters                                  #
    # ------------------------------------------------------------------ #
    interface.in.errors:
      column_oids:
      - attributes:
        - name: interface.name
        oid: 1.3.6.1.2.1.2.2.1.14
      sum:
        aggregation: cumulative
        monotonic: true
        value_type: int
      unit: '1'
    interface.in.octets:
      column_oids:
      - attributes:
        - name: interface.name
        oid: 1.3.6.1.2.1.2.2.1.10
      sum:
        aggregation: cumulative
        monotonic: true
        value_type: int
      unit: By
    interface.out.octets:
      column_oids:
      - attributes:
        - name: interface.name
        oid: 1.3.6.1.2.1.2.2.1.16
      sum:
        aggregation: cumulative
        monotonic: true
        value_type: int
      unit: By
    system.uptime:
      gauge:
        value_type: int
      scalar_oids:
      - oid: 1.3.6.1.2.1.1.3.0
      unit: s
    # ------------------------------------------------------------------ #
    # CPU — HOST-RESOURCES-MIB hrProcessorLoad (per-CPU load %)           #
    # Requires hostres.so module: pfSense > Services > SNMP > Modules     #
    # One data point per CPU core; label = cpu.description (hrDeviceDescr)#
    # Expected VM name: system_cpu_load_ratio                             #
    # ------------------------------------------------------------------ #
    system.cpu.load:
      column_oids:
      - attributes:
        - name: cpu.description
        oid: 1.3.6.1.2.1.25.3.3.1.2   # hrProcessorLoad (0-100 %)
      gauge:
        value_type: int
      unit: '1'
    # ------------------------------------------------------------------ #
    # Disk/storage — HOST-RESOURCES-MIB hrStorage table                   #
    # storage.description label = hrStorageDescr (e.g. "Real Memory", "/")#
    # Bytes used = hrStorageUsed * hrStorageAllocationUnits                #
    # Expected VM names: system_storage_size_1 / _used_1 /                #
    #                    system_storage_allocation_units_bytes             #
    # ------------------------------------------------------------------ #
    system.storage.size:
      column_oids:
      - attributes:
        - name: storage.description
        oid: 1.3.6.1.2.1.25.2.3.1.5   # hrStorageSize (allocation units)
      gauge:
        value_type: int
      unit: '{blocks}'
    system.storage.used:
      column_oids:
      - attributes:
        - name: storage.description
        oid: 1.3.6.1.2.1.25.2.3.1.6   # hrStorageUsed (allocation units)
      gauge:
        value_type: int
      unit: '{blocks}'
    system.storage.allocation_units:
      column_oids:
      - attributes:
        - name: storage.description
        oid: 1.3.6.1.2.1.25.2.3.1.4   # hrStorageAllocationUnits (bytes per block)
      gauge:
        value_type: int
      unit: By
    # ------------------------------------------------------------------ #
    # Interface status — IF-MIB (1=up 2=down 3=testing 7=lowerLayerDown)  #
    # Uses only interface.name (ifDescr, MIB-II mibII.so) to avoid        #
    # silent drops from ifAlias (ifXTable) which pfSense bsnmpd may not   #
    # expose without additional modules.                                   #
    # Expected VM name: interface_operational_status_ratio                 #
    # ------------------------------------------------------------------ #
    interface.operational.status:
      column_oids:
      - attributes:
        - name: interface.name
        oid: 1.3.6.1.2.1.2.2.1.8     # ifOperStatus
      gauge:
        value_type: int
      unit: '1'
    # ------------------------------------------------------------------ #
    # IP address mapping — IP-MIB ipAddrTable                             #
    # Value = ifIndex (integer); labels carry ip.address + ip.netmask     #
    # Used for Interface Summary table in Grafana (join by ifIndex)        #
    # Expected VM name: interface_ip_ifindex_ratio                        #
    # ------------------------------------------------------------------ #
    interface.ip.ifindex:
      column_oids:
      - attributes:
        - name: ip.address
        - name: ip.netmask
        oid: 1.3.6.1.2.1.4.20.1.2    # ipAdEntIfIndex
      gauge:
        value_type: int
      unit: '1'
  version: v2c


