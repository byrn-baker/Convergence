receivers:
snmp/homeswitch01:
  attributes:
    interface.description:
      indexed_value_prefix: ''
      oid: 1.3.6.1.2.1.31.1.1.1.18
    interface.name:
      indexed_value_prefix: ''
      oid: 1.3.6.1.2.1.2.2.1.2
  collection_interval: 60s
  community: ${env:SNMP_COMMUNITY}
  endpoint: udp://192.168.3.2:161
  metrics:
    interface.in.errors:
      column_oids:
      - attributes:
        - name: interface.name
        oid: 1.3.6.1.2.1.2.2.1.14
      sum:
        aggregation: cumulative
        monotonic: true
        value_type: int
      unit: '1'
    interface.in.octets:
      column_oids:
      - attributes:
        - name: interface.name
        oid: 1.3.6.1.2.1.2.2.1.10
      sum:
        aggregation: cumulative
        monotonic: true
        value_type: int
      unit: By
    interface.out.octets:
      column_oids:
      - attributes:
        - name: interface.name
        oid: 1.3.6.1.2.1.2.2.1.16
      sum:
        aggregation: cumulative
        monotonic: true
        value_type: int
      unit: By
    system.uptime:
      gauge:
        value_type: int
      scalar_oids:
      - oid: 1.3.6.1.2.1.1.3.0
      unit: s
  version: v2c
