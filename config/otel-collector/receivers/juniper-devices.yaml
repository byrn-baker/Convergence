# Juniper Device Configuration for OTEL Collector
# This file contains device-specific configurations for Juniper equipment

# List of Juniper devices to monitor
devices:
  # Example Juniper MX Router
  - name: "juniper-mx-01"
    endpoint: "192.168.2.1"
    snmp:
      version: "v2c"
      community: "${SNMP_COMMUNITY}"
      port: 161
    telemetry:
      enabled: true
      protocol: "netconf"
      port: 830
    jti:
      enabled: true
      port: 50051
    syslog:
      enabled: true
    labels:
      device_type: "router"
      vendor: "juniper"
      platform: "junos"
      model: "mx"
      site: "datacenter-1"
      role: "edge"

  # Example Juniper QFX Switch
  - name: "juniper-qfx-01"
    endpoint: "192.168.2.10"
    snmp:
      version: "v3"
      username: "${SNMP_V3_USERNAME}"
      auth_password: "${SNMP_V3_PASSWORD}"
      priv_password: "${SNMP_V3_PRIV_PASSWORD}"
      auth_protocol: "SHA"
      priv_protocol: "AES"
      port: 161
    telemetry:
      enabled: true
      protocol: "netconf"
      port: 830
    jti:
      enabled: true
      port: 50051
    syslog:
      enabled: true
    labels:
      device_type: "switch"
      vendor: "juniper"
      platform: "junos"
      model: "qfx"
      site: "datacenter-1"
      role: "leaf"

  # Example Juniper EX Switch
  - name: "juniper-ex-01"
    endpoint: "192.168.2.20"
    snmp:
      version: "v2c"
      community: "${SNMP_COMMUNITY}"
      port: 161
    telemetry:
      enabled: true
      protocol: "netconf"
      port: 830
    syslog:
      enabled: true
    labels:
      device_type: "switch"
      vendor: "juniper"
      platform: "junos"
      model: "ex"
      site: "datacenter-2"
      role: "access"

# Juniper-specific OID mappings
oids:
  # System information
  system:
    uptime: "1.3.6.1.2.1.1.3.0"
    name: "1.3.6.1.2.1.1.5.0"
    location: "1.3.6.1.2.1.1.6.0"
    description: "1.3.6.1.2.1.1.1.0"

  # Interface statistics (IF-MIB - standard)
  interface:
    index: "1.3.6.1.2.1.2.2.1.1"
    description: "1.3.6.1.2.1.2.2.1.2"
    type: "1.3.6.1.2.1.2.2.1.3"
    mtu: "1.3.6.1.2.1.2.2.1.4"
    speed: "1.3.6.1.2.1.2.2.1.5"
    admin_status: "1.3.6.1.2.1.2.2.1.7"
    oper_status: "1.3.6.1.2.1.2.2.1.8"
    in_octets: "1.3.6.1.2.1.2.2.1.10"
    in_unicast_pkts: "1.3.6.1.2.1.2.2.1.11"
    in_errors: "1.3.6.1.2.1.2.2.1.14"
    in_discards: "1.3.6.1.2.1.2.2.1.13"
    out_octets: "1.3.6.1.2.1.2.2.1.16"
    out_unicast_pkts: "1.3.6.1.2.1.2.2.1.17"
    out_errors: "1.3.6.1.2.1.2.2.1.20"
    out_discards: "1.3.6.1.2.1.2.2.1.19"

  # Juniper-specific operating stats (JUNIPER-MIB)
  juniper:
    operating_state: "1.3.6.1.4.1.2636.3.1.13.1.6"
    operating_temp: "1.3.6.1.4.1.2636.3.1.13.1.7"
    operating_cpu: "1.3.6.1.4.1.2636.3.1.13.1.8"
    operating_buffer: "1.3.6.1.4.1.2636.3.1.13.1.11"
    operating_heap: "1.3.6.1.4.1.2636.3.1.13.1.12"

  # Routing Engine CPU (JUNIPER-MIB)
  cpu:
    re_cpu_util: "1.3.6.1.4.1.2636.3.1.13.1.8"
    re_cpu_idle: "1.3.6.1.4.1.2636.3.1.13.1.9"
    re_load_avg_1min: "1.3.6.1.4.1.2636.3.1.13.1.20"
    re_load_avg_5min: "1.3.6.1.4.1.2636.3.1.13.1.21"
    re_load_avg_15min: "1.3.6.1.4.1.2636.3.1.13.1.22"

  # Memory (JUNIPER-MIB)
  memory:
    re_memory_util: "1.3.6.1.4.1.2636.3.1.13.1.11"
    re_buffer_util: "1.3.6.1.4.1.2636.3.1.13.1.12"

  # Chassis/Environmental (JUNIPER-MIB)
  chassis:
    temp: "1.3.6.1.4.1.2636.3.1.13.1.7"
    fan_status: "1.3.6.1.4.1.2636.3.1.13.1.6"
    psu_status: "1.3.6.1.4.1.2636.3.1.13.1.5"

  # BGP (standard BGP4-MIB)
  bgp:
    peer_state: "1.3.6.1.2.1.15.3.1.2"
    peer_admin_status: "1.3.6.1.2.1.15.3.1.3"
    peer_established_time: "1.3.6.1.2.1.15.3.1.16"
    peer_in_updates: "1.3.6.1.2.1.15.3.1.10"
    peer_out_updates: "1.3.6.1.2.1.15.3.1.11"

  # MPLS (MPLS-LSR-STD-MIB)
  mpls:
    interface_in_labels: "1.3.6.1.2.1.10.166.2.1.2.1.4"
    interface_out_labels: "1.3.6.1.2.1.10.166.2.1.2.1.5"
    interface_failures: "1.3.6.1.2.1.10.166.2.1.2.1.6"

# Juniper syslog patterns for parsing
syslog_patterns:
  # Interface up/down
  - pattern: 'SNMP_TRAP_LINK_(?P<state>UP|DOWN): ifIndex (?P<ifindex>\d+), ifAdminStatus (?P<admin_status>\w+), ifOperStatus (?P<oper_status>\w+), ifName (?P<interface>\S+)'
    severity: "notice"
    category: "interface_status"

  # BGP neighbor events
  - pattern: 'bgp_peer_state_changed: BGP peer (?P<neighbor>\S+) \(.*?\) changed state from (?P<old_state>\w+) to (?P<new_state>\w+)'
    severity: "warning"
    category: "bgp"

  - pattern: 'BGP_PREFIX_THRESH_EXCEEDED: (?P<neighbor>\S+) \(.*?\): Configured maximum prefix-limit\((?P<limit>\d+)\) threshold\((?P<threshold>\d+)\)% exceeded'
    severity: "warning"
    category: "bgp"

  # Configuration changes
  - pattern: 'UI_COMMIT_COMPLETED: User \'(?P<user>\w+)\' committed configuration from (?P<source>\w+)'
    severity: "notice"
    category: "configuration"

  # Authentication
  - pattern: 'LOGIN: User \'(?P<user>\w+)\' logged in from (?P<source>\S+)'
    severity: "notice"
    category: "authentication"

  - pattern: 'login: (?P<attempts>\d+) LOGIN FAILURES FROM (?P<source>\S+)'
    severity: "warning"
    category: "authentication"

  # Chassis alarms
  - pattern: 'CHASSIS_ALARM: Alarm (?P<alarm_type>\w+) (?P<state>set|cleared) for (?P<component>.*)'
    severity: "critical"
    category: "hardware"

  # RPD (routing protocol daemon) events
  - pattern: 'RPD_(?P<protocol>\w+)_NEIGHBOR_(?P<state>UP|DOWN): (?P<protocol_detail>.*)'
    severity: "warning"
    category: "routing_protocol"

# Juniper Telemetry Interface (JTI) sensor paths
jti_sensors:
  # Interface statistics
  - name: "interface_stats"
    path: "/interfaces/"
    interval: 30
    suppress_unchanged: true

  # Routing engine statistics
  - name: "routing_engine"
    path: "/junos/system/linecard/cpu/memory/"
    interval: 60
    suppress_unchanged: false

  # BGP statistics
  - name: "bgp_neighbors"
    path: "/junos/protocols/bgp/"
    interval: 60
    suppress_unchanged: true

  # MPLS statistics
  - name: "mpls_lsp"
    path: "/junos/protocols/mpls/"
    interval: 60
    suppress_unchanged: true

  # Firewall statistics
  - name: "firewall"
    path: "/junos/services/firewall/"
    interval: 30
    suppress_unchanged: true

# NETCONF subscriptions for streaming telemetry
netconf_subscriptions:
  - name: "interface_operational"
    xpath: "/interfaces/interface"
    interval: 30

  - name: "system_statistics"
    xpath: "/system-statistics"
    interval: 60

  - name: "chassis_hardware"
    xpath: "/chassis/hardware"
    interval: 300

  - name: "routing_tables"
    xpath: "/route-information/route-table"
    interval: 60
