# Grafana Datasource Provisioning for VictoriaMetrics
apiVersion: 1

datasources:
  - name: VictoriaMetrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    jsonData:
      httpMethod: POST
      customQueryParameters: ""
      timeInterval: "30s"
    editable: false
    version: 1
