# Grafana Dashboard Provisioning Configuration
apiVersion: 1

providers:
  # Network monitoring dashboards (SNMP, interfaces, device health)
  - name: 'Network'
    orgId: 1
    folder: 'Network'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/network
      foldersFromFilesStructure: false

  # Security & Firewall dashboards (pfSense, threat analysis, GeoIP)
  - name: 'Security'
    orgId: 1
    folder: 'Security'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/security
      foldersFromFilesStructure: false

