# Grafana Unified Alerting — Alert Rules
# ---------------------------------------------------------------------------
# These rules query VictoriaMetrics (Prometheus-compatible) and Loki
# for security and network health conditions.
#
# Data sources referenced:
#   - VictoriaMetrics: uid="P4169E866C3094E38" (Prometheus type)
#   - Loki:            uid="P8E80F9AEF21F6940" (Loki type)
#
# IMPORTANT: These UIDs are instance-specific — Grafana assigns them when data
# sources are first provisioned. If you redeploy from scratch, verify UIDs with:
#   curl -s -u admin:admin http://localhost:3000/api/datasources | \
#     python3 -c "import sys,json; [print(f['uid'],'-',f['name']) for f in json.load(sys.stdin)]"
#
# Folder: "Security Alerts" and "Network Health" are created automatically.
# ---------------------------------------------------------------------------
apiVersion: 1

groups:
  # ===========================================================================
  # Security: Firewall-based alerts (VictoriaMetrics / firewall_events_total)
  # ===========================================================================
  - orgId: 1
    name: Firewall Security
    folder: Security Alerts
    interval: 1m
    rules:
      # -----------------------------------------------------------------------
      # Alert: Sustained high block rate from a single source country.
      # Fires when one country produces >1000 block events in the past hour.
      # Covers slow-burn reconnaissance that wouldn't trigger 5-min spike rules.
      # Tune threshold based on your normal traffic — query:
      #   sum by (src_country)(increase(firewall_events_total{action="block"}[1h]))
      # -----------------------------------------------------------------------
      - uid: fw-country-block-spike
        title: "High Block Rate From Country (1h)"
        condition: threshold
        data:
          - refId: blocks_by_country
            queryType: ""
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: P4169E866C3094E38
            model:
              expr: >
                topk(1,
                  sum by (src_country) (
                    increase(firewall_events_total{action="block"}[1h])
                  )
                )
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: blocks_by_country
          - refId: threshold
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: threshold
              expression: blocks_by_country
              conditions:
                - evaluator:
                    type: gt
                    params: [1000]
                  operator:
                    type: and
                  query:
                    params: [blocks_by_country]
                  reducer:
                    type: max
                    params: []
                  type: query
        noDataState: OK
        execErrState: Alerting
        for: 5m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "High block rate from {{ $labels.src_country }}"
          description: >
            {{ $values.blocks_by_country }} firewall block events from
            {{ $labels.src_country }} in the last hour. This may indicate
            a coordinated scan or DDoS campaign. Check the pfSense Security
            Dashboard and consider adding a firewall block rule.
          runbook: "Check pfSense Security Dashboard → Top Source Countries"
        isPaused: false

      # -----------------------------------------------------------------------
      # Alert: Overall firewall block volume spike.
      # Fires when total blocks over 5 minutes exceeds 500, regardless of source.
      # Catches distributed attacks that evade per-country thresholds.
      # -----------------------------------------------------------------------
      - uid: fw-total-block-spike
        title: "Firewall Block Rate Spike (5m)"
        condition: threshold
        data:
          - refId: total_blocks
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: P4169E866C3094E38
            model:
              expr: >
                sum(increase(firewall_events_total{action="block"}[5m]))
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: total_blocks
          - refId: threshold
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: threshold
              expression: total_blocks
              conditions:
                - evaluator:
                    type: gt
                    params: [500]
                  operator:
                    type: and
                  query:
                    params: [total_blocks]
                  reducer:
                    type: max
                    params: []
                  type: query
        noDataState: OK
        execErrState: Alerting
        for: 3m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "Firewall block spike: {{ $values.total_blocks }} blocks in 5m"
          description: >
            Total firewall block events reached {{ $values.total_blocks }} in the
            last 5 minutes (threshold: 500). This may indicate a DDoS ramp-up
            or large-scale port scan. Review the WAN Threats map on the
            pfSense Security Dashboard.
          runbook: "Check pfSense Security Dashboard → WAN Threats Geomap"
        isPaused: false

  # ===========================================================================
  # Network Health: SNMP device uptime and availability
  # ===========================================================================
  - orgId: 1
    name: Network Health
    folder: Network Alerts
    interval: 2m
    rules:
      # -----------------------------------------------------------------------
      # Alert: Network switch has rebooted (uptime counter reset).
      # The SNMP sysUpTime OID is a monotonically increasing gauge. A sudden
      # drop (negative delta) means the device rebooted unexpectedly.
      # delta() returns the change over the window — negative = uptime reset.
      # -----------------------------------------------------------------------
      - uid: net-switch-reboot
        title: "Network Switch Rebooted"
        condition: threshold
        data:
          - refId: uptime_delta
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: P4169E866C3094E38
            model:
              # delta() returns change in value; negative delta = counter reset = reboot
              expr: >
                delta(system_uptime_seconds{device_role="home_switch"}[5m])
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: uptime_delta
          - refId: threshold
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: threshold
              expression: uptime_delta
              conditions:
                - evaluator:
                    type: lt
                    params: [-60]   # uptime decreased by more than 60s = reboot
                  operator:
                    type: and
                  query:
                    params: [uptime_delta]
                  reducer:
                    type: min
                    params: []
                  type: query
        noDataState: NoData
        execErrState: Alerting
        for: 0m    # Fire immediately — reboots are already complete
        labels:
          severity: critical
          team: network
        annotations:
          summary: "{{ $labels.device_name }} has rebooted"
          description: >
            Device {{ $labels.device_name }} ({{ $labels.device_ip }}) uptime
            counter dropped by {{ $values.uptime_delta }}s, indicating an
            unexpected reboot. Verify the switch is operational and check
            for power events. Site: {{ $labels.device_site }}.
          runbook: "Check Interface Utilization dashboard for traffic gap post-reboot"
        isPaused: false

      # -----------------------------------------------------------------------
      # Alert: Switch uptime is very low (recently rebooted or just came online).
      # Fires when any switch reports less than 10 minutes of uptime.
      # Catches reboots even if the delta alert misses the transition.
      # -----------------------------------------------------------------------
      - uid: net-switch-low-uptime
        title: "Network Switch Has Low Uptime (Recent Reboot)"
        condition: threshold
        data:
          - refId: low_uptime
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: P4169E866C3094E38
            model:
              expr: >
                min by (device_name, device_ip, device_site) (
                  system_uptime_seconds{device_role="home_switch"}
                )
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: low_uptime
          - refId: threshold
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: threshold
              expression: low_uptime
              conditions:
                - evaluator:
                    type: lt
                    params: [600]   # Less than 10 minutes uptime
                  operator:
                    type: and
                  query:
                    params: [low_uptime]
                  reducer:
                    type: min
                    params: []
                  type: query
        noDataState: NoData
        execErrState: Alerting
        for: 2m
        labels:
          severity: critical
          team: network
        annotations:
          summary: "{{ $labels.device_name }} has low uptime ({{ $values.low_uptime }}s)"
          description: >
            Switch {{ $labels.device_name }} at {{ $labels.device_ip }} reports
            only {{ $values.low_uptime }} seconds of uptime. The device recently
            rebooted or restarted. Verify it has come back online correctly and
            all interfaces are operational. Site: {{ $labels.device_site }}.
          runbook: "Check Interface Utilization dashboard; verify all VLANs are up"
        isPaused: false

      # -----------------------------------------------------------------------
      # Alert: SNMP polling failure (no data for a device).
      # If VictoriaMetrics stops receiving system_uptime for a device, the
      # device is unreachable via SNMP — either down or network path broken.
      # -----------------------------------------------------------------------
      - uid: net-device-snmp-down
        title: "Network Device SNMP Unreachable"
        condition: threshold
        data:
          - refId: device_uptime
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: P4169E866C3094E38
            model:
              # Count devices that have recently reported uptime metrics
              expr: >
                count by (device_name, device_ip, device_site) (
                  system_uptime_seconds{device_role="home_switch"}
                )
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: device_uptime
          - refId: threshold
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: threshold
              expression: device_uptime
              conditions:
                - evaluator:
                    type: lt
                    params: [1]   # No data points = device unreachable
                  operator:
                    type: and
                  query:
                    params: [device_uptime]
                  reducer:
                    type: min
                    params: []
                  type: query
        noDataState: Alerting   # No data IS the alert condition
        execErrState: Alerting
        for: 5m   # Allow time for transient SNMP timeouts
        labels:
          severity: critical
          team: network
        annotations:
          summary: "{{ $labels.device_name }} is not responding to SNMP"
          description: >
            SNMP polling for {{ $labels.device_name }} ({{ $labels.device_ip }})
            has returned no data for more than 5 minutes. The device may be
            powered off, unreachable, or the SNMP service may have stopped.
            Check physical connectivity and SNMP service status.
          runbook: "SSH to device if reachable; check SNMP service; ping device IP"
        isPaused: false
