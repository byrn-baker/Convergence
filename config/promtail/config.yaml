server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Syslog receiver - TCP (RFC 3164 BSD syslog)
  - job_name: syslog
    syslog:
      listen_address: 0.0.0.0:514
      listen_protocol: tcp
      idle_timeout: 60s
      use_incoming_timestamp: true
      max_message_length: 8192
      labels:
        job: "syslog"
        protocol: "tcp"
    relabel_configs:
      - source_labels: ['__syslog_message_hostname']
        target_label: 'hostname'
      - source_labels: ['__syslog_message_app_name']
        target_label: 'app'
      - source_labels: ['__syslog_message_severity']
        target_label: 'severity'

  # Syslog receiver - UDP (RFC 3164 BSD syslog)
  - job_name: syslog-udp
    syslog:
      listen_address: 0.0.0.0:514
      listen_protocol: udp
      use_incoming_timestamp: true
      max_message_length: 8192
      labels:
        job: "syslog"
        protocol: "udp"
    relabel_configs:
      - source_labels: ['__syslog_message_hostname']
        target_label: 'hostname'
      - source_labels: ['__syslog_message_app_name']
        target_label: 'app'
      - source_labels: ['__syslog_message_severity']
        target_label: 'severity'
