server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Tail syslog logs from OTEL Collector
  - job_name: otel-syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          __path__: /data/syslog/*.jsonl
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            body: body
            appname: resourceLogs[0].scopeLogs[0].logRecords[0].attributes.appname
            protocol: resourceLogs[0].scopeLogs[0].logRecords[0].attributes.protocol
            facility: resourceLogs[0].scopeLogs[0].logRecords[0].attributes.facility
      - labels:
          appname:
          protocol:
          facility:
      - output:
          source: body
