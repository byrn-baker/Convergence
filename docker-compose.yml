services:
  # OpenTelemetry Collector - Telemetry convergence layer
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: convergence-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector:/etc/otelcol:ro
      - ./data/otelcol:/data
      - ./data/geoip:/var/lib/geoip:ro
    ports:
      # OTLP receivers
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      # Legacy receivers
      - "8888:8888"     # Prometheus metrics (self-monitoring)
      - "13133:13133"   # Health check
      # Syslog receivers (RFC 3164 BSD format)
      - "514:514/udp"   # Syslog UDP
      - "514:514/tcp"   # Syslog TCP
      # Network telemetry receivers
      - "162:162/udp"   # SNMP traps
      - "9000:9000"     # gNMI
      - "6030:6030"     # gRPC telemetry (Cisco MDT)
      - "2055:2055/udp" # NetFlow v5/v9 (pfSense pflow/softflowd)
      - "4739:4739/udp" # IPFIX (NetFlow v10)
    environment:
      - NETWORK_USERNAME=${NETWORK_USERNAME:-admin}
      - NETWORK_PASSWORD=${NETWORK_PASSWORD:-admin}
      - SNMP_COMMUNITY=${SNMP_COMMUNITY:-public}
    networks:
      - convergence
    restart: unless-stopped
    healthcheck:
      test: ["NONE"]

  # VictoriaMetrics - High-performance time-series database
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: convergence-victoriametrics
    command:
      - "--storageDataPath=/storage"
      - "--retentionPeriod=${VM_RETENTION_PERIOD:-90d}"
      - "--httpListenAddr=:8428"
      - "--promscrape.config=/etc/victoriametrics/prometheus.yml"
    volumes:
      - ./config/victoriametrics:/etc/victoriametrics:ro
      - victoriametrics-data:/storage
    ports:
      - "8428:8428"     # HTTP API
    networks:
      - convergence
    restart: unless-stopped
    healthcheck:
      test: ["NONE"]

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: convergence-grafana
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - ./data/geoip:/var/lib/grafana/geoip:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"     # Web UI
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
      - GF_DATABASE_GEOIP_DATA_PATH=/var/lib/grafana/geoip/GeoLite2-City.mmdb
      - GF_GEOMAP_ENABLE_CUSTOM_BASELAYER=true
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-https://discord.com/api/webhooks/0/placeholder}
    networks:
      - convergence
    depends_on:
      - victoriametrics
      - loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Loki - Log aggregation system
  loki:
    image: grafana/loki:latest
    container_name: convergence-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./config/loki:/etc/loki:ro
      - loki-data:/loki
    ports:
      - "3100:3100"     # HTTP API
    networks:
      - convergence
    restart: unless-stopped
    healthcheck:
      test: ["NONE"]

  # Promtail - Tails syslog files written by OTEL Collector
  promtail:
    image: grafana/promtail:2.9.10
    container_name: convergence-promtail
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./config/promtail:/etc/promtail:ro
      - ./data/otelcol:/data:ro
    ports:
      - "9080:9080"     # Promtail HTTP metrics
    networks:
      - convergence
    depends_on:
      - loki
      - otel-collector
    restart: unless-stopped

  # Alertmanager - Routes alerts from Loki ruler and Grafana to receivers
  alertmanager:
    image: prom/alertmanager:latest
    container_name: convergence-alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=http://localhost:9093"
    volumes:
      - ./config/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"     # Web UI + API
    networks:
      - convergence
    restart: unless-stopped
    healthcheck:
      test: ["NONE"]

  # Threat Intelligence service - enriches top IPs with external APIs + AI narratives
  threat-intel:
    build:
      context: ./services/threat-intel
      dockerfile: Dockerfile
    container_name: convergence-threat-intel
    ports:
      - "8001:8000"   # FastAPI (host 8001 → container 8000)
    environment:
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - GREYNOISE_API_KEY=${GREYNOISE_API_KEY:-}
      - OTX_API_KEY=${OTX_API_KEY:-}
      - IPINFO_TOKEN=${IPINFO_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - REDIS_URL=redis://redis:6379/0
      - VICTORIAMETRICS_URL=http://victoriametrics:8428
      - LOKI_URL=http://loki:3100
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - convergence
    depends_on:
      - redis
      - victoriametrics
      - loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # NetClaw - AI Network Engineering Agent (CCIE L4 escalation)
  netclaw:
    build:
      context: ./netclaw
      dockerfile: ../docker/netclaw.Dockerfile
    image: convergence_netclaw:latest
    container_name: convergence-netclaw
    ports:
      - "18789:18789"    # OpenClaw Gateway API
      - "18790:18790"    # NetClaw REST Proxy
      - "3001:3000"      # NetClaw Visual HUD
    volumes:
      - netclaw-workspace:/app/workspace
      - ./config/netclaw:/root/.openclaw
      - ./config/netclaw/workspace/skills:/app/workspace/skills:ro
      - ./mcp-servers/convergence-mcp:/app/mcp-servers/convergence-mcp:ro
      - ./mcp-servers/netclaw-proxy:/app/mcp-servers/netclaw-proxy:ro
    environment:
      - OPENCLAW_MODE=gateway
      - NETCLAW_LAB_MODE=false
      - NAUTOBOT_URL=${NAUTOBOT_URL}
      - NAUTOBOT_TOKEN=${NAUTOBOT_TOKEN}
      - NAUTOBOT_VERIFY_SSL=false
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OLLAMA_API_KEY=${OLLAMA_CLOUD_API_KEY}
      - OLLAMA_HOST=https://ollama.com
      - VICTORIAMETRICS_URL=http://victoriametrics:8428
      - GRAFANA_URL=http://grafana:3000
      - LOKI_URL=http://loki:3100
      - PFSENSE_HOST=${PFSENSE_HOST}
      - PFSENSE_XMLRPC_USER=${PFSENSE_XMLRPC_USER:-admin}
      - PFSENSE_XMLRPC_PASS=${PFSENSE_XMLRPC_PASS:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - NETWORK_USERNAME=${NETWORK_USERNAME}
      - SNMP_COMMUNITY=${SNMP_COMMUNITY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - convergence
    depends_on:
      - victoriametrics
      - loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Automation Agent - Phase 5: event-driven pfSense automation with GAIT audit trail
  automation-agent:
    build:
      context: ./services/automation-agent
      dockerfile: Dockerfile
    container_name: convergence-automation-agent
    ports:
      - "8002:8000"   # FastAPI (host 8002 → container 8000)
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - REDIS_URL=redis://redis:6379/1
      - VICTORIAMETRICS_URL=http://victoriametrics:8428
      - LOKI_URL=http://loki:3100
      - THREAT_INTEL_URL=http://threat-intel:8000
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID:-0}
      - PFSENSE_HOST=${PFSENSE_HOST:-}
      - PFSENSE_XMLRPC_USER=${PFSENSE_XMLRPC_USER:-admin}
      - PFSENSE_XMLRPC_PASS=${PFSENSE_XMLRPC_PASS:-}
      - PFSENSE_XMLRPC_TARGET=${PFSENSE_XMLRPC_TARGET:-alias}
      - PFSENSE_SSH_HOST=${PFSENSE_SSH_HOST:-}
      - PFSENSE_SSH_USER=${PFSENSE_SSH_USER:-admin}
      - PFSENSE_SSH_KEY_PATH=${PFSENSE_SSH_KEY_PATH:-/app/secrets/pfsense_id_ed25519}
      - DRY_RUN=${DRY_RUN:-true}
      - AUTO_ACTION_THRESHOLD=${AUTO_ACTION_THRESHOLD:-80}
      - AUTO_APPROVE_THRESHOLD=${AUTO_APPROVE_THRESHOLD:-95}
      - MAX_ACTIONS_PER_HOUR=${MAX_ACTIONS_PER_HOUR:-5}
      - BLOCK_TTL_HOURS=${BLOCK_TTL_HOURS:-24}
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-600}
      - POLL_ENABLED=false
    volumes:
      - automation-audit:/app/audit-repo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - convergence
    depends_on:
      - threat-intel
      - redis
      - victoriametrics
      - loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # NET-OPS Team - RETIRED in Phase 10 (replaced by convergence-scheduler + NetClaw skills)
  # Service code archived in services/net-ops-team/ for reference

  # Convergence Scheduler - Cron + Discord, triggers NetClaw skills (Phase 10)
  convergence-scheduler:
    build:
      context: ./services/convergence-scheduler
      dockerfile: Dockerfile
    container_name: convergence-scheduler
    ports:
      - "8004:8000"
    environment:
      - NETCLAW_PROXY_URL=http://netclaw:18790
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - NETOPS_CHANNEL_ID=${NETOPS_CHANNEL_ID:-0}
      - POLL_INTERVAL_MINUTES=${SCHEDULER_POLL_MINUTES:-10}
      - REPORT_INTERVAL_MINUTES=${SCHEDULER_REPORT_MINUTES:-60}
      - DEDUP_MINUTES=30
    networks:
      - convergence
    depends_on:
      - netclaw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Redis - Caching and queue (optional, for future extensions)
  redis:
    image: redis:7-alpine
    container_name: convergence-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - convergence
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  convergence:
    name: convergence-network
    driver: bridge

volumes:
  netclaw-workspace:
    name: convergence-netclaw-workspace

  victoriametrics-data:
    name: convergence-victoriametrics-data
  grafana-data:
    name: convergence-grafana-data
  loki-data:
    name: convergence-loki-data
  alertmanager-data:
    name: convergence-alertmanager-data
  redis-data:
    name: convergence-redis-data
  automation-audit:
    name: convergence-automation-audit
