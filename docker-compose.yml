services:
  # OpenTelemetry Collector - Telemetry convergence layer
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: convergence-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector:/etc/otelcol:ro
      - ./data/otelcol:/data
    ports:
      # OTLP receivers
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      # Legacy receivers
      - "8888:8888"     # Prometheus metrics (self-monitoring)
      - "13133:13133"   # Health check
      # Syslog receivers (RFC 3164 BSD format)
      - "514:514/udp"   # Syslog UDP
      - "514:514/tcp"   # Syslog TCP
      # Network telemetry receivers
      - "162:162/udp"   # SNMP traps
      - "9000:9000"     # gNMI
      - "6030:6030"     # gRPC telemetry (Cisco MDT)
    environment:
      - NETWORK_USERNAME=${NETWORK_USERNAME:-admin}
      - NETWORK_PASSWORD=${NETWORK_PASSWORD:-admin}
      - SNMP_COMMUNITY=${SNMP_COMMUNITY:-public}
    networks:
      - convergence
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # VictoriaMetrics - High-performance time-series database
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: convergence-victoriametrics
    command:
      - "--storageDataPath=/storage"
      - "--retentionPeriod=${VM_RETENTION_PERIOD:-90d}"
      - "--httpListenAddr=:8428"
      - "--promscrape.config=/etc/victoriametrics/prometheus.yml"
    volumes:
      - ./config/victoriametrics:/etc/victoriametrics:ro
      - victoriametrics-data:/storage
    ports:
      - "8428:8428"     # HTTP API
    networks:
      - convergence
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8428/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: convergence-grafana
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - ./data/geoip:/var/lib/grafana/geoip:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"     # Web UI
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=
      - GF_DATABASE_GEOIP_DATA_PATH=/var/lib/grafana/geoip/GeoLite2-City.mmdb
      - GF_GEOMAP_ENABLE_CUSTOM_BASELAYER=true
    networks:
      - convergence
    depends_on:
      - victoriametrics
      - loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Loki - Log aggregation system
  loki:
    image: grafana/loki:latest
    container_name: convergence-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./config/loki:/etc/loki:ro
      - loki-data:/loki
    ports:
      - "3100:3100"     # HTTP API
    networks:
      - convergence
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Promtail - Tails syslog files written by OTEL Collector
  promtail:
    image: grafana/promtail:2.9.10
    container_name: convergence-promtail
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./config/promtail:/etc/promtail:ro
      - ./data/otelcol:/data:ro
    ports:
      - "9080:9080"     # Promtail HTTP metrics
    networks:
      - convergence
    depends_on:
      - loki
      - otel-collector
    restart: unless-stopped

  # Redis - Caching and queue (optional, for future extensions)
  redis:
    image: redis:7-alpine
    container_name: convergence-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - convergence
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  convergence:
    name: convergence-network
    driver: bridge

volumes:
  victoriametrics-data:
    name: convergence-victoriametrics-data
  grafana-data:
    name: convergence-grafana-data
  loki-data:
    name: convergence-loki-data
  redis-data:
    name: convergence-redis-data
