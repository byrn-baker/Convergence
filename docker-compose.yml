services:
  # OpenTelemetry Collector - Telemetry convergence layer
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: convergence-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector:/etc/otelcol:ro
      - ./data/otelcol:/data
      - ./data/geoip:/var/lib/geoip:ro
    ports:
      # OTLP receivers
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      # Legacy receivers
      - "8888:8888"     # Prometheus metrics (self-monitoring)
      - "13133:13133"   # Health check
      # Syslog receivers (RFC 3164 BSD format)
      - "514:514/udp"   # Syslog UDP
      - "514:514/tcp"   # Syslog TCP
      # Network telemetry receivers
      - "162:162/udp"   # SNMP traps
      - "9000:9000"     # gNMI
      - "6030:6030"     # gRPC telemetry (Cisco MDT)
    environment:
      - NETWORK_USERNAME=${NETWORK_USERNAME:-admin}
      - NETWORK_PASSWORD=${NETWORK_PASSWORD:-admin}
      - SNMP_COMMUNITY=${SNMP_COMMUNITY:-public}
    networks:
      - convergence
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # VictoriaMetrics - High-performance time-series database
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: convergence-victoriametrics
    command:
      - "--storageDataPath=/storage"
      - "--retentionPeriod=${VM_RETENTION_PERIOD:-90d}"
      - "--httpListenAddr=:8428"
      - "--promscrape.config=/etc/victoriametrics/prometheus.yml"
    volumes:
      - ./config/victoriametrics:/etc/victoriametrics:ro
      - victoriametrics-data:/storage
    ports:
      - "8428:8428"     # HTTP API
    networks:
      - convergence
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8428/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: convergence-grafana
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - ./data/geoip:/var/lib/grafana/geoip:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"     # Web UI
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
      - GF_DATABASE_GEOIP_DATA_PATH=/var/lib/grafana/geoip/GeoLite2-City.mmdb
      - GF_GEOMAP_ENABLE_CUSTOM_BASELAYER=true
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-https://discord.com/api/webhooks/0/placeholder}
    networks:
      - convergence
    depends_on:
      - victoriametrics
      - loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Loki - Log aggregation system
  loki:
    image: grafana/loki:latest
    container_name: convergence-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./config/loki:/etc/loki:ro
      - loki-data:/loki
    ports:
      - "3100:3100"     # HTTP API
    networks:
      - convergence
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Promtail - Tails syslog files written by OTEL Collector
  promtail:
    image: grafana/promtail:2.9.10
    container_name: convergence-promtail
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./config/promtail:/etc/promtail:ro
      - ./data/otelcol:/data:ro
    ports:
      - "9080:9080"     # Promtail HTTP metrics
    networks:
      - convergence
    depends_on:
      - loki
      - otel-collector
    restart: unless-stopped

  # Alertmanager - Routes alerts from Loki ruler and Grafana to receivers
  alertmanager:
    image: prom/alertmanager:latest
    container_name: convergence-alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=http://localhost:9093"
    volumes:
      - ./config/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"     # Web UI + API
    networks:
      - convergence
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Threat Intelligence service - enriches top IPs with external APIs + AI narratives
  threat-intel:
    build:
      context: ./services/threat-intel
      dockerfile: Dockerfile
    container_name: convergence-threat-intel
    ports:
      - "8001:8000"   # FastAPI (host 8001 → container 8000)
    environment:
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - GREYNOISE_API_KEY=${GREYNOISE_API_KEY:-}
      - OTX_API_KEY=${OTX_API_KEY:-}
      - IPINFO_TOKEN=${IPINFO_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - REDIS_URL=redis://redis:6379/0
      - VICTORIAMETRICS_URL=http://victoriametrics:8428
      - LOKI_URL=http://loki:3100
    networks:
      - convergence
    depends_on:
      - redis
      - victoriametrics
      - loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Automation Agent - Phase 5: event-driven pfSense automation with GAIT audit trail
  automation-agent:
    build:
      context: ./services/automation-agent
      dockerfile: Dockerfile
    container_name: convergence-automation-agent
    ports:
      - "8002:8000"   # FastAPI (host 8002 → container 8000)
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - REDIS_URL=redis://redis:6379/1
      - VICTORIAMETRICS_URL=http://victoriametrics:8428
      - LOKI_URL=http://loki:3100
      - THREAT_INTEL_URL=http://threat-intel:8000
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - PFSENSE_HOST=${PFSENSE_HOST:-}
      - PFSENSE_XMLRPC_USER=${PFSENSE_XMLRPC_USER:-admin}
      - PFSENSE_XMLRPC_PASS=${PFSENSE_XMLRPC_PASS:-}
      - PFSENSE_SSH_HOST=${PFSENSE_SSH_HOST:-}
      - PFSENSE_SSH_USER=${PFSENSE_SSH_USER:-admin}
      - PFSENSE_SSH_KEY_PATH=${PFSENSE_SSH_KEY_PATH:-/app/secrets/pfsense_id_ed25519}
      - DRY_RUN=${DRY_RUN:-true}
      - AUTO_ACTION_THRESHOLD=${AUTO_ACTION_THRESHOLD:-80}
      - AUTO_APPROVE_THRESHOLD=${AUTO_APPROVE_THRESHOLD:-95}
      - MAX_ACTIONS_PER_HOUR=${MAX_ACTIONS_PER_HOUR:-5}
      - BLOCK_TTL_HOURS=${BLOCK_TTL_HOURS:-24}
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-600}
    volumes:
      - automation-audit:/app/audit-repo
    networks:
      - convergence
    depends_on:
      - threat-intel
      - redis
      - victoriametrics
      - loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Redis - Caching and queue (optional, for future extensions)
  redis:
    image: redis:7-alpine
    container_name: convergence-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - convergence
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  convergence:
    name: convergence-network
    driver: bridge

volumes:
  victoriametrics-data:
    name: convergence-victoriametrics-data
  grafana-data:
    name: convergence-grafana-data
  loki-data:
    name: convergence-loki-data
  alertmanager-data:
    name: convergence-alertmanager-data
  redis-data:
    name: convergence-redis-data
  automation-audit:
    name: convergence-automation-audit
