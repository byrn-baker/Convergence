[pytest]
# Pytest configuration for Convergence Agent

# Test paths
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=agent
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80

# Markers for test categorization
markers =
    unit: Unit tests for individual functions/classes
    integration: Integration tests requiring external services
    e2e: End-to-end tests
    slow: Tests that take more than 1 second
    network: Tests that require network access
    nautobot: Tests that require Nautobot instance

# Asyncio configuration
asyncio_mode = auto

# Coverage options
[coverage:run]
source = agent
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
